name: Bug report
description: Something does not work as expected.
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Helpowl version
      placeholder: e.g. 0.1.0
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Helpowl Cloud
        - Self-hosted (Docker Compose)
        - Self-hosted (Helm / Kubernetes)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. Remove secrets and customer data first.
      render: shell
