name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem do you want to solve? Who has this problem?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you want it to work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What do you do today instead?
